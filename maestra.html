<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja Maestra - Centro de Acopio</title>
    <script src="datos.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; transition: all 0.3s; }
        .navbar { background-color: #333; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .navbar h2 { margin: 0; font-size: 1.2rem; }
        .nav-links { display: flex; gap: 10px; align-items: center; }
        .navbar a { color: white; text-decoration: none; padding: 8px 15px; border-radius: 4px; }
        .btn-panel { background-color: #0275d8; }
        .btn-panel:hover { background-color: #025aa5; }
        .btn-salir { background-color: #d9534f; }
        .btn-salir:hover { background-color: #c9302c; }
        .btn-theme { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: white; }
        .container { max-width: 1000px; margin: 30px auto; background-color: white; padding: 20px 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: all 0.3s; }
        h2 { color: #333; border-bottom: 2px solid #8a6d3b; padding-bottom: 10px; margin-bottom: 20px; }
        .form-group { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .form-group select, .form-group input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 200px; }
        button { padding: 10px 20px; background-color: #8a6d3b; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #6c542d; }
        button.danger { background-color: #d9534f; }
        button.danger:hover { background-color: #c9302c; }
        .busqueda { display: flex; gap: 10px; margin-bottom: 20px; }
        .busqueda input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .catalogo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .categoria-box { background-color: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #ddd; transition: all 0.3s; }
        .categoria-box h3 { margin-top: 0; color: #0275d8; border-bottom: 1px solid #ccc; padding-bottom: 5px; font-size: 1rem; }
        .categoria-box ul { list-style-type: none; padding: 0; margin: 0; max-height: 250px; overflow-y: auto; }
        .categoria-box li { padding: 4px 8px; border-bottom: 1px dashed #eee; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .categoria-box li:hover { background-color: #f1f1f1; }
        .btn-remove-prod { background: #d9534f; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; cursor: pointer; line-height: 20px; text-align: center; padding: 0; }
        .btn-remove-prod:hover { background: #c9302c; }
        .estadisticas { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #f8f9fa; padding: 12px; border-radius: 8px; text-align: center; border-top: 3px solid #8a6d3b; }
        .stat-card h4 { margin: 0; font-size: 11px; color: #666; text-transform: uppercase; }
        .stat-card p { margin: 5px 0 0; font-size: 22px; font-weight: bold; color: #333; }

        body.dark-mode { background-color: #0f172a; color: #f8fafc; }
        body.dark-mode .container { background-color: #1e293b; color: #f8fafc; }
        body.dark-mode .categoria-box { background-color: #0f172a; border-color: #475569; }
        body.dark-mode .categoria-box li:hover { background-color: #1e293b; }
        body.dark-mode .stat-card { background-color: #0f172a; }
        body.dark-mode .stat-card p { color: #f8fafc; }
        body.dark-mode h2 { color: #f8fafc; }
        body.dark-mode .navbar { background-color: #020617; }
        body.dark-mode .busqueda input { background-color: #0f172a; color: #f8fafc; border-color: #475569; }
    </style>
</head>
<body>

    <div class="navbar">
        <h2>⚙️ Hoja Maestra de Insumos</h2>
        <div class="nav-links">
            <button id="themeToggle" class="btn-theme" title="Cambiar tema">🌙</button>
            <a href="panel.html" class="btn-panel">Ir al Panel General</a>
            <a href="index.html" class="btn-salir">Cerrar Sesión</a>
        </div>
    </div>

    <div class="container">
        <!-- Estadísticas -->
        <div class="estadisticas">
            <div class="stat-card"><h4>Categorías</h4><p id="totalCategorias">0</p></div>
            <div class="stat-card"><h4>Productos Totales</h4><p id="totalProductos">0</p></div>
        </div>

        <h2>Añadir Nuevo Producto al Catálogo</h2>
        <form id="formMaestra" class="form-group">
            <select id="selectCategoria" required>
                <option value="">1. Selecciona la Categoría...</option>
            </select>
            <input type="text" id="nuevoProducto" placeholder="Escribe el nombre del nuevo producto..." required>
            <button type="submit">Añadir</button>
        </form>

        <h2>Buscar en el Catálogo</h2>
        <div class="busqueda">
            <input type="text" id="buscadorCatalogo" placeholder="🔍 Buscar producto en todo el catálogo...">
        </div>

        <h2>Catálogo Actual</h2>
        <div class="catalogo-grid" id="contenedorCatalogo"></div>
    </div>

    <script>
        // ============================================================
        // SUPABASE — CONEXIÓN
        // ============================================================
        const SUPABASE_URL = "https://sjvpcgjazubguzoxzwxl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_dR9ot8lbyJHZTxupgdeJRg_WmqYWFk8";

        function sincronizarCatalogoNube(tipo, categoria, producto) {
            if (tipo === "CATALOGO_ADD") {
                fetch(`${SUPABASE_URL}/rest/v1/catalogo`, {
                    method: "POST",
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify({ categoria, producto })
                }).catch(err => console.warn('Supabase no disponible (add):', err));

            } else if (tipo === "CATALOGO_DEL") {
                fetch(`${SUPABASE_URL}/rest/v1/catalogo?categoria=eq.${encodeURIComponent(categoria)}&producto=eq.${encodeURIComponent(producto)}`, {
                    method: "DELETE",
                    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
                }).catch(err => console.warn('Supabase no disponible (del):', err));
            }
        }

        // ============================================================
        // VERIFICAR ACCESO
        // ============================================================
        if (sessionStorage.getItem('userRole') !== 'admin') {
            alert('Acceso restringido. Debes iniciar sesión como administrador.');
            window.location.href = 'index.html';
        }

        // ============================================================
        // MODO OSCURO
        // ============================================================
        const themeToggle = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            themeToggle.innerText = '☀️';
        }
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            themeToggle.innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        });

        // ============================================================
        // CATÁLOGO: inicialización
        // ============================================================
        let catalogoMaestro = JSON.parse(localStorage.getItem('catalogoAcopio'));

        if (!catalogoMaestro) {
            catalogoMaestro = JSON.parse(JSON.stringify(catalogoMaestroGlobal));
            localStorage.setItem('catalogoAcopio', JSON.stringify(catalogoMaestro));
        }

        const contenedor = document.getElementById('contenedorCatalogo');
        const form = document.getElementById('formMaestra');
        const selectCat = document.getElementById('selectCategoria');

        Object.keys(catalogoMaestro).sort().forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.textContent = cat;
            selectCat.appendChild(opt);
        });

        // ============================================================
        // ESTADÍSTICAS
        // ============================================================
        function actualizarEstadisticas() {
            const totalCat = Object.keys(catalogoMaestro).length;
            let totalProd = 0;
            Object.values(catalogoMaestro).forEach(arr => totalProd += arr.length);
            document.getElementById('totalCategorias').innerText = totalCat;
            document.getElementById('totalProductos').innerText = totalProd;
        }

        // ============================================================
        // RENDERIZAR CATÁLOGO
        // ============================================================
        function renderizarCatalogo(filtro) {
            contenedor.innerHTML = '';
            const texto = (filtro || '').toLowerCase();

            for (const [categoria, productos] of Object.entries(catalogoMaestro)) {
                let productosFiltrados = productos;
                if (texto) {
                    productosFiltrados = productos.filter(p => p.toLowerCase().includes(texto));
                    if (productosFiltrados.length === 0) continue;
                }

                const caja = document.createElement('div');
                caja.className = 'categoria-box';
                
                let listaHTML = `<h3>${categoria} <span style="font-weight:normal;font-size:11px;color:#999;">(${productosFiltrados.length})</span></h3><ul>`;
                productosFiltrados.forEach(prod => {
                    listaHTML += `<li>
                        <span>${prod}</span>
                        <button class="btn-remove-prod" onclick="eliminarProducto('${categoria.replace(/'/g, "\\'")}', '${prod.replace(/'/g, "\\'")}')" title="Eliminar">×</button>
                    </li>`;
                });
                listaHTML += `</ul>`;
                
                caja.innerHTML = listaHTML;
                contenedor.appendChild(caja);
            }
        }

        // ============================================================
        // AÑADIR PRODUCTO Y ACTUALIZAR HISTORIAL AUTOMÁTICAMENTE
        // ============================================================
        form.addEventListener('submit', function(event) {
            event.preventDefault();
            const categoria = document.getElementById('selectCategoria').value;
            const nuevoProd = document.getElementById('nuevoProducto').value.trim();

            if (!categoria || !nuevoProd) return;

            if (catalogoMaestro[categoria].includes(nuevoProd)) {
                alert('Ese producto ya existe en esta categoría.');
                return;
            }

            catalogoMaestro[categoria].push(nuevoProd);
            catalogoMaestro[categoria].sort();
            localStorage.setItem('catalogoAcopio', JSON.stringify(catalogoMaestro));

            sincronizarCatalogoNube("CATALOGO_ADD", categoria, nuevoProd);

            // ✨ ACTUALIZACIÓN RETROACTIVA EN LA BASE DE DATOS ✨
            fetch(`${SUPABASE_URL}/rest/v1/inventario?producto=eq.${encodeURIComponent(nuevoProd)}`, {
                method: "PATCH",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`,
                    "Content-Type": "application/json",
                    "Prefer": "return=minimal"
                },
                body: JSON.stringify({ categoria: categoria })
            }).then(() => console.log(`Registros pasados de '${nuevoProd}' actualizados a '${categoria}'`))
              .catch(err => console.error("Error actualizando registros retroactivos:", err));

            renderizarCatalogo(document.getElementById('buscadorCatalogo').value);
            actualizarEstadisticas();
            document.getElementById('nuevoProducto').value = '';
            alert(`"${nuevoProd}" añadido a ${categoria}.\n\n✅ Todos los registros anteriores que decían "Otros" han sido actualizados a su nueva categoría en la base de datos.`);
        });

        // ============================================================
        // ELIMINAR PRODUCTO
        // ============================================================
        window.eliminarProducto = function(categoria, producto) {
            if (!confirm(`¿Eliminar "${producto}" de ${categoria}?`)) return;

            const idx = catalogoMaestro[categoria].indexOf(producto);
            if (idx > -1) {
                catalogoMaestro[categoria].splice(idx, 1);
                localStorage.setItem('catalogoAcopio', JSON.stringify(catalogoMaestro));

                sincronizarCatalogoNube("CATALOGO_DEL", categoria, producto);

                renderizarCatalogo(document.getElementById('buscadorCatalogo').value);
                actualizarEstadisticas();
            }
        };

        document.getElementById('buscadorCatalogo').addEventListener('input', function() {
            renderizarCatalogo(this.value);
        });

        renderizarCatalogo();
        actualizarEstadisticas();
    </script>
</body>
</html>
