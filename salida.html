<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Despacho - SOS UCAB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="datos.js"></script>
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; --text: #1e293b; --card-bg: #ffffff; --navbar-bg: #e11d48; --border: #e2e8f0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding-bottom: 50px; transition: all 0.3s; }
        
        .navbar { background-color: var(--navbar-bg); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .nav-links { display: flex; gap: 10px; align-items: center; }
        .navbar a, .btn-theme { color: white; text-decoration: none; padding: 8px 15px; border-radius: 8px; background: rgba(255,255,255,0.1); font-size: 0.9rem; border: none; cursor: pointer; }
        
        .main-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 20px; max-width: 1400px; margin: 0 auto; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border-top: 4px solid var(--navbar-bg); transition: all 0.3s; }
        
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 5px; }
        th { color: #64748b; text-transform: uppercase; font-size: 0.65rem; padding: 8px; text-align: left; }
        td { background: #f1f5f9; padding: 8px; font-size: 0.75rem; border-bottom: 1px solid var(--border); }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        label { font-size: 0.7rem; color: #64748b; font-weight: 600; text-transform: uppercase; margin-bottom: 3px; display: block; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; }
        .full-width { grid-column: span 2; }
        .btn-add { background: var(--navbar-bg); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 10px; }

        body.dark-mode { --bg: #0f172a; --text: #f8fafc; --card-bg: #1e293b; --navbar-bg: #881337; --border: #475569; }
        body.dark-mode td { background-color: #334155; color: #f8fafc; }
    </style>
</head>
<body>

    <div class="navbar">
        <h2 style="margin:0; font-size: 1.2rem;">🚚 Módulo de Despacho</h2>
        <div class="nav-links">
            <button id="themeToggle" class="btn-theme">🌙</button>
            <a href="inventario_general.html">📊 Inv.</a>
            <a href="index.html" style="background: #be123c;">Volver</a>
        </div>
    </div>

    <div class="main-layout">
        <div class="card">
            <h2>📜 Despachos Realizados</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>Fecha</th><th>Despacho</th><th>Insumo</th><th>Cant</th><th>Inst.</th><th>Responsable</th></tr>
                    </thead>
                    <tbody id="tablaSesion"></tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h2>Registrar Salida</h2>
            <form id="registroForm">
                <div class="form-grid">
                    <div><label>Fecha</label><input type="date" id="fecha" required></div>
                    <div><label>N° Despacho</label><input type="text" id="nDespacho" required></div>
                    <div class="full-width"><label>Insumo</label><input list="listaInsumos" id="producto" required></div>
                    <datalist id="listaInsumos"></datalist>
                    <div><label>Cantidad</label><input type="number" id="cantidad" required></div>
                    <div><label>Institución</label><input type="text" id="institucion" required></div>
                    <div class="full-width"><label>Contacto Responsable</label><input type="text" id="contacto"></div>
                    <div class="full-width"><label>Persona que acompaña</label><input type="text" id="acompanante"></div>
                    <div class="full-width"><label>Persona que autorizó</label><input type="text" id="autoriza"></div>
                    <div class="full-width"><label>Observaciones</label><textarea id="observaciones" rows="2"></textarea></div>
                </div>
                <button type="submit" id="btnSubmit" class="btn-add">Registrar Despacho en la Nube</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://sjvpcgjazubguzoxzwxl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_dR9ot8lbyJHZTxupgdeJRg_WmqYWFk8";

        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            themeToggle.innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
        });

        const datalist = document.getElementById('listaInsumos');
        [catalogoMaestroGlobal, JSON.parse(localStorage.getItem('catalogoAcopio') || '{}')].forEach(catObj => {
            for (const cat in catObj) { catObj[cat].forEach(item => datalist.innerHTML += `<option value="${item}">`); }
        });

        // --- SINCRONIZAR AL ABRIR ---
        function cargarCatalogoDesdeNube() {
            fetch(`${SUPABASE_URL}/rest/v1/catalogo?select=*`, {
                headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
            }).then(res => res.json()).then(data => {
                const optionsActuales = new Set();
                Array.from(datalist.options).forEach(opt => optionsActuales.add(opt.value));
                
                data.forEach(item => {
                    if (item.producto && item.producto !== "" && !optionsActuales.has(item.producto)) {
                        datalist.innerHTML += `<option value="${item.producto}">`;
                        optionsActuales.add(item.producto);
                    }
                });
            }).catch(err => console.warn("Error sincronizando catálogo:", err));
        }
        cargarCatalogoDesdeNube();

        document.getElementById('fecha').value = new Date().toISOString().split('T')[0];

        function renderizar() {
            const tbody = document.getElementById('tablaSesion');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#64748b;">⏳ Cargando...</td></tr>';
            fetch(`${SUPABASE_URL}/rest/v1/salidas?select=*&order=created_at.desc&limit=50`, {
                headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
            })
            .then(r => r.json())
            .then(rows => {
                tbody.innerHTML = '';
                if (!rows.length) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#64748b;">Sin despachos registrados.</td></tr>'; return; }
                rows.forEach(item => {
                    tbody.innerHTML += `<tr>
                        <td>${item.fecha || '-'}</td>
                        <td>${item.n_despacho || '-'}</td>
                        <td>${item.producto || '-'}</td>
                        <td style="color:#e11d48; font-weight:bold;">-${item.cantidad || 0}</td>
                        <td>${item.institucion || '-'}</td>
                        <td>${item.contacto || '-'}</td>
                    </tr>`;
                });
            })
            .catch(() => { tbody.innerHTML = '<tr><td colspan="6" style="color:#e11d48;">❌ Error cargando despachos.</td></tr>'; });
        }

        document.getElementById('registroForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true; btn.innerText = "Enviando a la nube...";

            const data = {
                fecha: document.getElementById('fecha').value,
                nDespacho: document.getElementById('nDespacho').value,
                producto: document.getElementById('producto').value,
                cantidad: document.getElementById('cantidad').value,
                institucion: document.getElementById('institucion').value,
                contacto: document.getElementById('contacto').value,
                acompanante: document.getElementById('acompanante').value,
                autoriza: document.getElementById('autoriza').value,
                observaciones: document.getElementById('observaciones').value
            };

            fetch(`${SUPABASE_URL}/rest/v1/salidas`, {
                method: "POST",
                headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", "Prefer": "return=minimal" },
                body: JSON.stringify({
                    fecha: data.fecha, n_despacho: data.nDespacho, producto: data.producto,
                    cantidad: parseInt(data.cantidad), institucion: data.institucion,
                    contacto: data.contacto, acompanante: data.acompanante,
                    autoriza: data.autoriza, observaciones: data.observaciones
                })
            }).then(res => {
                if (!res.ok) throw new Error('Error Supabase: ' + res.status);
                this.reset();
                document.getElementById('fecha').value = new Date().toISOString().split('T')[0];
                alert("✅ Despacho registrado en Supabase.");
                renderizar(); 
            }).catch(err => alert("⚠️ Error enviando a Supabase: " + err))
              .finally(() => { btn.disabled = false; btn.innerText = "Registrar Despacho en la Nube"; });
        });

        renderizar();
    </script>
</body>
</html>
