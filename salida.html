<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Despacho de Insumos - SOS UCAB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="datos.js"></script>
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; --text: #1e293b; --card-bg: #ffffff; --navbar-bg: #e11d48; --border: #e2e8f0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding-bottom: 50px; transition: background-color 0.3s, color 0.3s; }
        
        .navbar { background-color: var(--navbar-bg); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .nav-links { display: flex; gap: 10px; align-items: center; }
        .navbar a, .btn-theme { color: white; text-decoration: none; padding: 8px 15px; border-radius: 8px; background: rgba(255,255,255,0.1); font-size: 0.9rem; border: none; cursor: pointer; }
        
        .main-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; padding: 20px; max-width: 1400px; margin: 0 auto; }
        .card { background: var(--card-bg); padding: 24px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border-top: 4px solid var(--navbar-bg); }
        
        /* Tabla Ajustada */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        th { color: #64748b; text-transform: uppercase; font-size: 0.65rem; padding: 10px; text-align: left; }
        td { background: #f1f5f9; padding: 10px; font-size: 0.75rem; border-bottom: 1px solid var(--border); }
        
        /* Formulario */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        label { font-size: 0.7rem; color: #64748b; font-weight: 600; text-transform: uppercase; margin-bottom: 3px; display: block; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; background-color: var(--card-bg); color: var(--text); }
        .full-width { grid-column: span 2; }
        .btn-add { background: var(--navbar-bg); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 10px; }

        body.dark-mode { --bg: #0f172a; --text: #f8fafc; --card-bg: #1e293b; --navbar-bg: #881337; --border: #475569; }
        body.dark-mode td { background-color: #334155; color: #f8fafc; }
    </style>
</head>
<body>

    <div class="navbar">
        <h2 style="margin:0; font-size: 1.2rem;">🚚 Módulo de Despacho</h2>
        <div class="nav-links">
            <button id="themeToggle" class="btn-theme">🌙</button>
            <a href="inventario_general.html">📊 Inv.</a>
            <a href="index.html" style="background: #be123c;">Volver</a>
        </div>
    </div>

    <div class="main-layout">
        <!-- Lado Izquierdo: Lista Completa -->
        <div class="card">
            <h2>📦 Despachos Realizados</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>Fecha</th><th>Despacho</th><th>Insumo</th><th>Cant</th><th>Inst.</th><th>Contacto</th></tr>
                    </thead>
                    <tbody id="tablaSesion"></tbody>
                </table>
            </div>
        </div>

        <!-- Lado Derecho: Formulario -->
        <div class="card">
            <h2>Registrar Salida</h2>
            <form id="registroForm">
                <div class="form-grid">
                    <div><label>Fecha</label><input type="date" id="fecha" required></div>
                    <div><label>N° Despacho</label><input type="text" id="nDespacho" required></div>
                    <div class="full-width"><label>Insumo Específico</label><input list="listaInsumos" id="producto" required></div>
                    <datalist id="listaInsumos"></datalist>
                    <div><label>Cantidad</label><input type="number" id="cantidad" required></div>
                    <div><label>Institución</label><input type="text" id="institucion" required></div>
                    <div class="full-width"><label>Contacto Responsable</label><input type="text" id="contacto"></div>
                    <div class="full-width"><label>Persona que acompaña</label><input type="text" id="acompanante"></div>
                    <div class="full-width"><label>Persona que autorizó</label><input type="text" id="autoriza"></div>
                    <div class="full-width"><label>Observaciones</label><textarea id="observaciones" rows="2"></textarea></div>
                </div>
                <button type="submit" class="btn-add">Registrar Despacho</button>
            </form>
        </div>
    </div>

    <script>
        // MODO OSCURO
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
            themeToggle.innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
        });

        // CATÁLOGO
        const datalist = document.getElementById('listaInsumos');
        const catalogoLocal = JSON.parse(localStorage.getItem('catalogoAcopio')) || {};
        [catalogoMaestroGlobal, catalogoLocal].forEach(catObj => {
            for (const cat in catObj) { catObj[cat].forEach(item => { datalist.innerHTML += `<option value="${item}">`; }); }
        });

        document.getElementById('fecha').value = new Date().toISOString().split('T')[0];

        // LÓGICA DE LISTA Y GUARDADO
        let misSalidas = JSON.parse(localStorage.getItem('salidasAcopio')) || [];

        function renderizar() {
            const tbody = document.getElementById('tablaSesion');
            tbody.innerHTML = '';
            [...misSalidas].reverse().forEach((item) => {
                tbody.innerHTML += `<tr>
                    <td>${item.fecha || '-'}</td>
                    <td>${item.nDespacho || '-'}</td>
                    <td>${item.producto || '-'}</td>
                    <td style="color:#e11d48; font-weight:bold;">-${item.cantidad || 0}</td>
                    <td>${item.institucion || '-'}</td>
                    <td>${item.contacto || '-'}</td>
                </tr>`;
            });
        }

        document.getElementById('registroForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = {
                fecha: document.getElementById('fecha').value,
                nDespacho: document.getElementById('nDespacho').value,
                producto: document.getElementById('producto').value,
                cantidad: document.getElementById('cantidad').value,
                institucion: document.getElementById('institucion').value,
                contacto: document.getElementById('contacto').value,
                acompanante: document.getElementById('acompanante').value,
                autoriza: document.getElementById('autoriza').value,
                observaciones: document.getElementById('observaciones').value
            };
            
            misSalidas.push(data);
            localStorage.setItem('salidasAcopio', JSON.stringify(misSalidas));
            renderizar();
            this.reset();
            document.getElementById('fecha').value = new Date().toISOString().split('T')[0];
        });

        renderizar();
    </script>
</body>
</html>
