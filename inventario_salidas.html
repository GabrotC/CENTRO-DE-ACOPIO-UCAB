<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario Neto - SOS UCAB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; padding: 20px; color: #1e293b; transition: all 0.3s; }
        .card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 1000px; margin: auto; transition: all 0.3s; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; margin-top: 20px; }
        th { color: #64748b; font-size: 0.75rem; text-transform: uppercase; padding: 10px; text-align: left; transition: all 0.3s; }
        td { background: #f1f5f9; padding: 14px; font-weight: 500; transition: all 0.3s; }
        .col-in { color: #16a34a; font-weight: bold; }
        .col-out { color: #e11d48; font-weight: bold; }
        .col-net { font-size: 1.1em; }
        
        td.status-ok { background-color: #f1f5f9; }
        td.status-low { background-color: #fef9c3; }
        td.status-empty { background-color: #fee2e2; }
        
        .btn-volver { background: #1e293b; color: white; padding: 10px 15px; border-radius: 8px; text-decoration: none; font-size: 0.9rem; display: inline-block; }
        .btn-theme { background: none; border: none; font-size: 1.5rem; cursor: pointer; margin-right: 15px; }
        .filtro-cat { padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 0.9rem; background: white; }

        body.dark-mode { background-color: #0f172a; color: #f8fafc; }
        body.dark-mode .card { background-color: #1e293b; color: #f8fafc; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        body.dark-mode td { background-color: #334155; color: #f8fafc; }
        body.dark-mode th { color: #94a3b8; }
        body.dark-mode .btn-volver { background-color: #4f46e5; }
        body.dark-mode .filtro-cat { background-color: #0f172a; color: #f8fafc; border-color: #475569; }
        body.dark-mode td.status-ok { background-color: #334155; }
        body.dark-mode td.status-low { background-color: #713f12; }
        body.dark-mode td.status-empty { background-color: #7f1d1d; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-flex">
            <h2>📦 Inventario Neto (Entradas vs Salidas)</h2>
            <div>
                <button id="themeToggle" class="btn-theme" title="Cambiar tema">🌙</button>
                <a href="index.html" class="btn-volver">Volver al Inicio</a>
            </div>
        </div>
        
        <div style="margin: 15px 0; display: flex; gap: 10px; flex-wrap: wrap;">
            <select id="filtroCategoria" class="filtro-cat">
                <option value="Todas">Todas las categorías</option>
            </select>
        </div>
        
        <table>
            <thead><tr><th>Producto</th><th>Categoría</th><th>Entradas (➕)</th><th>Salidas (➖)</th><th>Stock Real (🟰)</th><th>Último Mov.</th><th>Estado</th></tr></thead>
            <tbody id="tablaNeto"></tbody>
        </table>
    </div>

    <script>
        // --- MODO OSCURO ---
        const themeToggle = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            themeToggle.innerText = '☀️';
        }
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                themeToggle.innerText = '☀️';
            } else {
                localStorage.setItem('theme', 'light');
                themeToggle.innerText = '🌙';
            }
        });

        // ---- SUPABASE ----
        const SUPABASE_URL = "https://sjvpcgjazubguzoxzwxl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_dR9ot8lbyJHZTxupgdeJRg_WmqYWFk8";

        const resumen = {};
        const filtroCat = document.getElementById('filtroCategoria');

        // --- RENDERIZAR TABLA NETA ---
        function renderizar() {
            const tbody = document.getElementById('tablaNeto');
            const catSel = filtroCat.value;
            tbody.innerHTML = '';

            for (const [prod, data] of Object.entries(resumen)) {
                if (catSel !== 'Todas' && data.categoria !== catSel) continue;

                let claseEstado = "status-ok";
                let estado = "✅ OK";
                if (data.neto <= 0) { estado = "🔴 Agotado"; claseEstado = "status-empty"; }
                else if (data.neto < 10) { estado = "⚠️ Bajo"; claseEstado = "status-low"; }

                tbody.innerHTML += `<tr>
                    <td>${prod}</td>
                    <td>${data.categoria || '-'}</td>
                    <td class="col-in">${data.entradas}</td>
                    <td class="col-out">${data.salidas}</td>
                    <td class="col-net ${claseEstado}">${data.neto}</td>
                    <td>${data.ultimoMov || '-'}</td>
                    <td>${estado}</td>
                </tr>`;
            }
        }

        // --- CARGAR ENTRADAS Y SALIDAS EN PARALELO DESDE SUPABASE ---
        function cargarDatos() {
            document.getElementById('tablaNeto').innerHTML = '<tr><td colspan="7" style="text-align:center; color:#64748b;">⏳ Cargando datos...</td></tr>';

            const headers = { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` };

            Promise.all([
                fetch(`${SUPABASE_URL}/rest/v1/inventario?select=*`, { headers }).then(r => r.json()),
                fetch(`${SUPABASE_URL}/rest/v1/salidas?select=*`, { headers }).then(r => r.json())
            ])
            .then(([entradas, salidas]) => {
                Object.keys(resumen).forEach(k => delete resumen[k]);

                // Procesar entradas
                entradas.forEach(item => {
                    if (!resumen[item.producto]) resumen[item.producto] = { categoria: item.categoria || 'Otros', entradas: 0, salidas: 0, neto: 0, ultimoMov: '' };
                    resumen[item.producto].entradas += parseInt(item.cantidad) || 0;
                    resumen[item.producto].neto     += parseInt(item.cantidad) || 0;
                    if (item.fecha && item.fecha > resumen[item.producto].ultimoMov) resumen[item.producto].ultimoMov = item.fecha;
                });

                // Procesar salidas
                salidas.forEach(item => {
                    if (!resumen[item.producto]) resumen[item.producto] = { categoria: 'Otros', entradas: 0, salidas: 0, neto: 0, ultimoMov: '' };
                    resumen[item.producto].salidas += parseInt(item.cantidad) || 0;
                    resumen[item.producto].neto    -= parseInt(item.cantidad) || 0;
                    if (item.fecha && item.fecha > resumen[item.producto].ultimoMov) resumen[item.producto].ultimoMov = item.fecha;
                });

                // Poblar filtro de categorías
                const cats = new Set(Object.values(resumen).map(d => d.categoria).filter(Boolean));
                filtroCat.innerHTML = '<option value="Todas">Todas las categorías</option>';
                Array.from(cats).sort().forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c; opt.innerText = c;
                    filtroCat.appendChild(opt);
                });

                renderizar();
            })
            .catch(err => {
                document.getElementById('tablaNeto').innerHTML = `<tr><td colspan="7" style="color:#e11d48; text-align:center;">❌ Error: ${err}</td></tr>`;
            });
        }

        filtroCat.addEventListener('change', renderizar);
        cargarDatos();
        // ============================================================
        // SUPABASE REALTIME — inventario neto en vivo
        // ============================================================
        const { createClient } = window.supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_KEY);

        const badge = document.createElement('span');
        badge.style.cssText = 'background:#16a34a;color:white;font-size:0.7rem;padding:3px 10px;border-radius:99px;margin-left:10px;';
        badge.innerText = '🟢 En vivo';
        document.querySelector('h2')?.appendChild(badge);

        function onCambio() {
            badge.innerText = '🟡 Actualizando...';
            badge.style.background = '#f59e0b';
            cargarDatos().then(() => {
                badge.innerText = '🟢 En vivo';
                badge.style.background = '#16a34a';
            });
        }

        db.channel('neto-admin')
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'inventario' }, onCambio)
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'salidas' }, onCambio)
          .subscribe();
    </script>
</body>
</html>
