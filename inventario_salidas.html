<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Neto - SOS UCAB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f8fafc;
            --text: #1e293b;
            --card-bg: #ffffff;
            --navbar-bg: #1e293b;
            --table-row: #f1f5f9;
            --border: #e2e8f0;
            --success: #16a34a;
            --danger: #e11d48;
            --warning: #f59e0b;
        }
        body.dark-mode {
            --bg: #0f172a;
            --text: #f8fafc;
            --card-bg: #1e293b;
            --navbar-bg: #020617;
            --table-row: #334155;
            --border: #475569;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); transition: all 0.3s; padding: 2rem; }
        
        .card { background: var(--card-bg); padding: 2rem; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); max-width: 1200px; margin: 0 auto; border: 1px solid var(--border); }
        .header-flex { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem; border-bottom: 2px solid var(--border); padding-bottom: 1rem; }
        .header-flex h2 { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 0.75rem; }
        
        .actions { display: flex; gap: 0.75rem; align-items: center; }
        .btn { padding: 0.6rem 1rem; border-radius: 8px; font-weight: 600; font-size: 0.9rem; text-decoration: none; cursor: pointer; border: none; font-family: inherit; transition: all 0.3s; }
        .btn-volver { background: var(--navbar-bg); color: white; }
        .btn-volver:hover { opacity: 0.9; }
        .btn-theme { background: transparent; font-size: 1.25rem; padding: 0.4rem; }
        
        .filters { margin-bottom: 1.5rem; display: flex; gap: 1rem; align-items: center; }
        .filtro-cat { padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; background: var(--bg); color: var(--text); font-family: inherit; min-width: 250px; }
        .filtro-cat:focus { outline: none; border-color: var(--primary); }
        
        .table-container { overflow-x: auto; max-height: 650px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: var(--card-bg); color: #64748b; font-size: 0.75rem; text-transform: uppercase; padding: 1rem; text-align: left; border-bottom: 2px solid var(--border); position: sticky; top: 0; }
        body.dark-mode th { color: #94a3b8; }
        td { padding: 1rem; font-size: 0.95rem; border-bottom: 1px solid var(--border); }
        
        .col-in { color: var(--success); font-weight: 600; }
        .col-out { color: var(--danger); font-weight: 600; }
        .col-net { font-size: 1.1rem; font-weight: 700; }
        
        tr.status-ok td { background-color: var(--table-row); }
        tr.status-low td { background-color: rgba(245, 158, 11, 0.05); }
        tr.status-empty td { background-color: rgba(225, 29, 72, 0.05); }
        
        body.dark-mode tr.status-low td { background-color: rgba(245, 158, 11, 0.1); }
        body.dark-mode tr.status-empty td { background-color: rgba(225, 29, 72, 0.1); }

        #liveBadge { background: var(--success); color: white; font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 99px; font-weight: 600; transition: background 0.3s; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-flex">
            <h2>
                📦 Inventario Neto
                <span id="liveBadge">🟢 En vivo</span>
            </h2>
            <div class="actions">
                <button id="themeToggle" class="btn btn-theme" title="Cambiar tema">🌙</button>
                <a href="index.html" class="btn btn-volver">Volver al Inicio</a>
            </div>
        </div>
        
        <div class="filters">
            <select id="filtroCategoria" class="filtro-cat">
                <option value="Todas">Todas las categorías</option>
            </select>
        </div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Categoría</th>
                        <th>Entradas (➕)</th>
                        <th>Salidas (➖)</th>
                        <th>Stock Real (🟰)</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tablaNeto">
                    <tr><td colspan="6" style="text-align:center; color:#64748b; padding:2rem;">⏳ Cargando balances...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // INIT
        initTheme('themeToggle');

        const resumen = {};
        const filtroCat = document.getElementById('filtroCategoria');
        const badge = document.getElementById('liveBadge');

        // RENDER TABLE
        function renderizar() {
            const tbody = document.getElementById('tablaNeto');
            const catSel = filtroCat.value;
            tbody.innerHTML = '';

            const sortedKeys = Object.keys(resumen).sort();

            sortedKeys.forEach(prod => {
                const data = resumen[prod];
                if (catSel !== 'Todas' && data.categoria !== catSel) return;

                let claseFila = "status-ok";
                let estadoTxt = "✅ OK";
                
                if (data.neto <= 0) { 
                    claseFila = "status-empty"; 
                    estadoTxt = "🔴 Agotado"; 
                } else if (data.neto < 10) { 
                    claseFila = "status-low"; 
                    estadoTxt = "⚠️ Bajo"; 
                }

                tbody.innerHTML += `<tr class="${claseFila}">
                    <td><strong>${prod}</strong></td>
                    <td><span style="font-size:0.8rem;color:#64748b;">${data.categoria}</span></td>
                    <td class="col-in">${data.entradas}</td>
                    <td class="col-out">${data.salidas}</td>
                    <td class="col-net">${data.neto}</td>
                    <td style="font-size:0.85rem;font-weight:600;">${estadoTxt}</td>
                </tr>`;
            });

            if (tbody.children.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#64748b;padding:2rem;">No hay productos en esta categoría.</td></tr>';
            }
        }

        // LOAD FROM SUPABASE
        function cargarDatos() {
            return Promise.all([
                supabaseGet('inventario', 'select=producto,categoria,cantidad'),
                supabaseGet('salidas', 'select=producto,cantidad')
            ])
            .then(([entradas, salidas]) => {
                Object.keys(resumen).forEach(k => delete resumen[k]);

                entradas.forEach(item => {
                    if (!resumen[item.producto]) {
                        resumen[item.producto] = { categoria: item.categoria || 'Otros', entradas: 0, salidas: 0, neto: 0 };
                    }
                    const q = parseInt(item.cantidad) || 0;
                    resumen[item.producto].entradas += q;
                    resumen[item.producto].neto += q;
                });

                salidas.forEach(item => {
                    if (!resumen[item.producto]) {
                        resumen[item.producto] = { categoria: 'Otros', entradas: 0, salidas: 0, neto: 0 };
                    }
                    const q = parseInt(item.cantidad) || 0;
                    resumen[item.producto].salidas += q;
                    resumen[item.producto].neto -= q;
                });

                const prevCat = filtroCat.value;
                const cats = new Set(Object.values(resumen).map(d => d.categoria));
                filtroCat.innerHTML = '<option value="Todas">Todas las categorías</option>';
                Array.from(cats).sort().forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c; opt.innerText = c;
                    filtroCat.appendChild(opt);
                });
                filtroCat.value = prevCat;

                renderizar();
            })
            .catch(err => {
                document.getElementById('tablaNeto').innerHTML = `<tr><td colspan="6" style="color:var(--danger); text-align:center; padding:2rem;">❌ Error cargando balances de Supabase.</td></tr>`;
                console.error(err);
            });
        }

        filtroCat.addEventListener('change', renderizar);
        cargarDatos();

        // REALTIME
        const db = crearClienteSupabase();
        if (db) {
            function onUpdate() {
                badge.innerText = '🟡 Calculando...';
                badge.style.background = 'var(--warning)';
                cargarDatos().then(() => {
                    badge.innerText = '🟢 En vivo';
                    badge.style.background = 'var(--success)';
                });
            }
            db.channel('neto-general')
              .on('postgres_changes', { event: '*', schema: 'public', table: 'inventario' }, onUpdate)
              .on('postgres_changes', { event: '*', schema: 'public', table: 'salidas' }, onUpdate)
              .subscribe();
        }
    </script>
</body>
</html>
