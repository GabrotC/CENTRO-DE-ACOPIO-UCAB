<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Voluntarios - Registro de Donativos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="datos.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --bg: #f8fafc;
            --text: #1e293b;
            --card-bg: #ffffff;
            --navbar-bg: #1e293b;
            --table-row: #f1f5f9;
            --border: #e2e8f0;
            --success: #16a34a;
            --danger: #e11d48;
            --warning: #f59e0b;
        }
        body.dark-mode {
            --bg: #0f172a;
            --text: #f8fafc;
            --card-bg: #1e293b;
            --navbar-bg: #020617;
            --table-row: #334155;
            --border: #475569;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            transition: all 0.3s ease;
        }

        /* NAVBAR */
        .navbar {
            background-color: var(--navbar-bg);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .navbar h2 { font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
        .nav-links { display: flex; gap: 0.75rem; align-items: center; }
        .btn-nav {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-nav:hover { background: rgba(255, 255, 255, 0.2); }
        .btn-theme { font-size: 1.2rem; padding: 0.4rem 0.6rem; }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #be123c; }

        /* LAYOUT */
        .main-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        @media (max-width: 1024px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        /* CARDS */
        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* FORM */
        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 0.25rem;
            text-transform: uppercase;
        }
        body.dark-mode .form-group label { color: #94a3b8; }
        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }
        
        .cat-badge {
            display: inline-block;
            background: rgba(79, 70, 229, 0.1);
            color: var(--primary);
            padding: 0.25rem 0.75rem;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 0.5rem;
            display: none;
        }
        body.dark-mode .cat-badge { background: rgba(129, 140, 248, 0.2); color: var(--primary-light); }

        .btn {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-add { background: var(--primary); margin-top: 0.5rem; }
        .btn-add:hover { background: #4338ca; }
        .btn-confirm { background: var(--success); margin-top: 1rem; padding: 1rem; font-size: 1.1rem; }
        .btn-confirm:hover { background: #15803d; }
        .btn-confirm:disabled { background: #9ca3af; cursor: not-allowed; opacity: 0.7; }

        /* CART TABLE */
        .cart-container { overflow-x: auto; flex: 1; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: #64748b; font-size: 0.75rem; text-transform: uppercase; font-weight: 600; }
        body.dark-mode th { color: #94a3b8; }
        td { font-size: 0.9rem; }
        
        .empty-cart {
            text-align: center;
            padding: 3rem 1rem;
            color: #64748b;
        }
        .empty-cart span { font-size: 2rem; display: block; margin-bottom: 0.5rem; }

        .qty-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-icon {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 28px;
            height: 28px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-icon:hover { background: var(--border); }
        .btn-remove { color: var(--danger); border-color: transparent; background: transparent; }
        .btn-remove:hover { background: rgba(225, 29, 72, 0.1); }

        /* HISTORY */
        .history-card { margin-top: 1.5rem; }
        .history-list { list-style: none; max-height: 250px; overflow-y: auto; }
        .history-item {
            padding: 0.75rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }
        .history-item:last-child { border-bottom: none; }
        .history-qty { font-weight: 700; color: var(--success); }
    </style>
</head>
<body>

    <nav class="navbar">
        <h2 id="voluntarioNombre">🤝 Portal de Voluntarios</h2>
        <div class="nav-links">
            <button id="themeToggle" class="btn-nav btn-theme">🌙</button>
            <a href="inventario_general.html" class="btn-nav">📊 Inventario</a>
            <a href="index.html" class="btn-nav btn-danger">Salir</a>
        </div>
    </nav>

    <div class="main-layout">
        
        <!-- LEFT: CART -->
        <div class="card" style="grid-row: span 2;">
            <h3>🛒 Carrito de Donación <span id="cartCountBadge" style="background:var(--primary);color:white;padding:2px 8px;border-radius:12px;font-size:0.8rem;margin-left:auto;">0</span></h3>
            
            <div class="cart-container">
                <table>
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Cant.</th>
                            <th>Obs.</th>
                            <th style="text-align:right;">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="cartBody">
                        <tr><td colspan="5">
                            <div class="empty-cart">
                                <span>📦</span>
                                El carrito está vacío.<br>Agrega productos desde el panel derecho.
                            </div>
                        </td></tr>
                    </tbody>
                </table>
            </div>

            <button id="btnConfirmar" class="btn btn-confirm" onclick="confirmarDonacion()" disabled>
                ✅ Confirmar Donación
            </button>
        </div>

        <!-- RIGHT: ADD FORM -->
        <div class="card">
            <h3>➕ Agregar Insumo</h3>
            <form id="addForm">
                <div class="form-group">
                    <label>Producto</label>
                    <input list="listaInsumos" id="producto" placeholder="Escribe o selecciona..." required autocomplete="off">
                    <datalist id="listaInsumos"></datalist>
                    <div id="catBadge" class="cat-badge">Categoría: <span id="catText"></span></div>
                </div>
                
                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label>Cantidad</label>
                        <input type="number" id="cantidad" min="1" value="1" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Fecha</label>
                        <input type="date" id="fecha" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Presentación / Observación (Opcional)</label>
                    <input type="text" id="observacion" placeholder="Ej. 500mg, Caja de 12, etc.">
                </div>

                <button type="submit" class="btn btn-add">👇 Agregar al Carrito</button>
            </form>
        </div>

        <!-- RIGHT BOTTOM: HISTORY -->
        <div class="card history-card">
            <h3>🕰️ Donaciones confirmadas hoy</h3>
            <ul class="history-list" id="historyList">
                <li class="history-item" style="justify-content:center;color:#64748b;">⏳ Cargando...</li>
            </ul>
        </div>

    </div>

    <script>
        // INIT
        verificarAcceso('voluntario');
        initTheme('themeToggle');

        const voluntarioNombre = sessionStorage.getItem('voluntarioActivo') || 'Voluntario';
        document.getElementById('voluntarioNombre').innerText = `🤝 Portal de ${voluntarioNombre}`;
        document.getElementById('fecha').value = fechaHoy();

        // CATALOG SETUP
        const datalist = document.getElementById('listaInsumos');
        const mapaCategorias = {};
        
        // Merge from global and local
        const catGlobal = catalogoMaestroGlobal || {};
        const catLocal = JSON.parse(localStorage.getItem('catalogoAcopio')) || {};
        const allCats = { ...catGlobal };
        
        for (const [cat, items] of Object.entries(catLocal)) {
            if (!allCats[cat]) allCats[cat] = [];
            items.forEach(i => { if (!allCats[cat].includes(i)) allCats[cat].push(i); });
        }

        const addedProducts = new Set();
        for (const [cat, items] of Object.entries(allCats)) {
            items.forEach(prod => {
                if (!addedProducts.has(prod)) {
                    mapaCategorias[prod] = cat;
                    const opt = document.createElement('option');
                    opt.value = prod;
                    datalist.appendChild(opt);
                    addedProducts.add(prod);
                }
            });
        }

        // CATEGORY DETECTION
        const prodInput = document.getElementById('producto');
        const catBadge = document.getElementById('catBadge');
        const catText = document.getElementById('catText');

        prodInput.addEventListener('input', () => {
            const cat = mapaCategorias[prodInput.value];
            if (cat) {
                catText.innerText = cat;
                catBadge.style.display = 'inline-block';
            } else {
                catBadge.style.display = 'none';
            }
        });

        // CART LOGIC
        let carrito = [];

        function renderCarrito() {
            const tbody = document.getElementById('cartBody');
            const countBadge = document.getElementById('cartCountBadge');
            const btnConfirmar = document.getElementById('btnConfirmar');
            
            countBadge.innerText = carrito.length;
            
            if (carrito.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5"><div class="empty-cart"><span>📦</span>El carrito está vacío.</div></td></tr>`;
                btnConfirmar.disabled = true;
                return;
            }

            btnConfirmar.disabled = false;
            tbody.innerHTML = '';
            
            carrito.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${item.producto}</strong></td>
                    <td><span style="font-size:0.75rem;background:var(--bg);padding:2px 6px;border-radius:4px;border:1px solid var(--border);">${item.categoria}</span></td>
                    <td>
                        <div class="qty-control">
                            <button class="btn-icon" onclick="cambiarCant(${index}, -1)">-</button>
                            <span style="width:20px;text-align:center;">${item.cantidad}</span>
                            <button class="btn-icon" onclick="cambiarCant(${index}, 1)">+</button>
                        </div>
                    </td>
                    <td>${item.obs || '-'}</td>
                    <td style="text-align:right;">
                        <button class="btn-icon btn-remove" onclick="removerItem(${index})" title="Eliminar">🗑️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('addForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const prod = prodInput.value.trim();
            const cant = parseInt(document.getElementById('cantidad').value);
            const obs = document.getElementById('observacion').value.trim();
            const cat = mapaCategorias[prod] || 'Otros';
            const fechaVal = document.getElementById('fecha').value;
            const datetime = `${fechaVal} ${horaActual()}`;

            if (!prod || cant < 1) return;

            // Check if already in cart
            const existingIdx = carrito.findIndex(i => i.producto === prod && i.obs === obs);
            if (existingIdx >= 0) {
                carrito[existingIdx].cantidad += cant;
            } else {
                carrito.push({
                    producto: prod,
                    categoria: cat,
                    cantidad: cant,
                    obs: obs,
                    fecha: datetime,
                    voluntario: voluntarioNombre
                });
            }

            renderCarrito();
            
            // Reset form
            prodInput.value = '';
            document.getElementById('cantidad').value = 1;
            document.getElementById('observacion').value = '';
            catBadge.style.display = 'none';
            prodInput.focus();
        });

        window.cambiarCant = (idx, delta) => {
            carrito[idx].cantidad += delta;
            if (carrito[idx].cantidad < 1) carrito[idx].cantidad = 1;
            renderCarrito();
        };

        window.removerItem = (idx) => {
            carrito.splice(idx, 1);
            renderCarrito();
        };

        // SUBMIT TO SUPABASE
        async function confirmarDonacion() {
            if (carrito.length === 0) return;
            
            if (!confirm(`Vas a registrar ${carrito.length} tipos de insumos. ¿Confirmar donación?`)) return;

            const btn = document.getElementById('btnConfirmar');
            btn.disabled = true;
            
            let exitos = 0;
            let errores = [];
            const itemsParaProcesar = [...carrito];

            for (let i = 0; i < itemsParaProcesar.length; i++) {
                btn.innerText = `⏳ Enviando ${i + 1}/${itemsParaProcesar.length}...`;
                const item = itemsParaProcesar[i];
                
                try {
                    await supabaseInsert('inventario', item);
                    exitos++;
                    // Eliminar del carrito visualmente si tuvo éxito
                    const currentIdx = carrito.findIndex(c => c.producto === item.producto && c.obs === item.obs);
                    if(currentIdx > -1) carrito.splice(currentIdx, 1);
                } catch (err) {
                    console.error("Error subiendo", item.producto, err);
                    errores.push(item.producto);
                }
            }

            renderCarrito();
            cargarHistorial(); // refresh history

            if (errores.length === 0) {
                btn.innerText = `✅ ¡Donación Exitosa!`;
                btn.style.background = 'var(--success)';
                setTimeout(() => {
                    btn.innerText = `✅ Confirmar Donación`;
                    btn.style.background = '';
                }, 3000);
            } else {
                alert(`Hubo un problema enviando: ${errores.join(', ')}. Los items que fallaron siguen en el carrito para reintentar.`);
                btn.innerText = `⚠️ Reintentar fallidos`;
                btn.disabled = false;
            }
        }

        // HISTORY LOAD
        async function cargarHistorial() {
            const list = document.getElementById('historyList');
            try {
                // Get today's date prefix
                const hoyStr = fechaHoy();
                const data = await supabaseGet('inventario', `voluntario=eq.${encodeURIComponent(voluntarioNombre)}&fecha=like.${hoyStr}%25&order=created_at.desc`);
                
                list.innerHTML = '';
                if (!data || data.length === 0) {
                    list.innerHTML = `<li class="history-item" style="color:#64748b;justify-content:center;">No hay registros hoy.</li>`;
                    return;
                }

                data.forEach(item => {
                    const timeOnly = item.fecha.split(' ')[1] || '';
                    list.innerHTML += `
                        <li class="history-item">
                            <div>
                                <strong style="display:block;">${item.producto}</strong>
                                <span style="font-size:0.75rem;color:#64748b;">${timeOnly} | ${item.obs || '-'}</span>
                            </div>
                            <span class="history-qty">+${item.cantidad}</span>
                        </li>
                    `;
                });
            } catch (err) {
                list.innerHTML = `<li class="history-item" style="color:var(--danger);justify-content:center;">❌ Error cargando historial</li>`;
            }
        }

        // REALTIME SUBSCRIPTION
        const db = crearClienteSupabase();
        if (db) {
            db.channel('voluntario-historial')
              .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'inventario', filter: `voluntario=eq.${voluntarioNombre}` }, () => {
                  cargarHistorial();
              })
              .subscribe();
        }

        // INITIAL LOAD
        cargarHistorial();

    </script>
</body>
</html>
