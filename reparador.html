        function addLog(msg) {
            const l = document.getElementById('log');
            l.innerHTML += `<div>${msg}</div>`;
            l.scrollTop = l.scrollHeight;
        }

        document.getElementById('btnReparar').addEventListener('click', async function() {
            this.disabled = true;
            this.innerText = "⏳ Sincronizando todo el sistema...";
            document.getElementById('log').innerHTML = "";
            addLog("Conectando a Supabase...");

            try {
                // PASO 1: Descargar el catálogo actual de la nube para no duplicar
                let catRes = await fetch(`${SUPABASE_URL}/rest/v1/catalogo?select=producto`, { headers: headersSupa });
                let catNube = await catRes.json();
                let productosEnCatalogo = new Set(catNube.map(c => c.producto.toLowerCase()));

                let añadidosAlCatalogo = 0;

                // PASO 2: Añadir los productos corregidos al Catálogo de la Hoja Maestra en la nube
                addLog("<b>[Fase 1] Actualizando Hoja Maestra...</b>");
                for (let [prod, cat] of Object.entries(correcciones)) {
                    if (!productosEnCatalogo.has(prod.toLowerCase())) {
                        await fetch(`${SUPABASE_URL}/rest/v1/catalogo`, {
                            method: "POST",
                            headers: { ...headersSupa, "Prefer": "return=minimal" },
                            body: JSON.stringify({ categoria: cat, producto: prod })
                        });
                        addLog(`➕ Añadido a Hoja Maestra: ${prod} -> ${cat}`);
                        añadidosAlCatalogo++;
                        productosEnCatalogo.add(prod.toLowerCase()); // Registrar para no repetirlo
                    }
                }

                // PASO 3: Corregir los registros viejos en el inventario
                addLog("<br><b>[Fase 2] Limpiando registros antiguos del inventario...</b>");
                let invRes = await fetch(`${SUPABASE_URL}/rest/v1/inventario?select=id,producto,categoria`, { headers: headersSupa });
                let inventario = await invRes.json();
                
                let arregladosEnInventario = 0;

                for (let fila of inventario) {
                    let catCorrecta = correcciones[fila.producto];
                    // Si el producto está en nuestra lista y su categoría en la nube dice "Otros" o está vacío
                    if (catCorrecta && (fila.categoria === 'Otros' || !fila.categoria)) {
                        await fetch(`${SUPABASE_URL}/rest/v1/inventario?id=eq.${fila.id}`, {
                            method: "PATCH",
                            headers: headersSupa,
                            body: JSON.stringify({ categoria: catCorrecta })
                        });
                        addLog(`✅ Corregido en inventario: ${fila.producto}`);
                        arregladosEnInventario++;
                    }
                }

                addLog(`<br>🎉 <b>¡Sincronización Completada!</b>`);
                addLog(`- Nuevos productos en la Hoja Maestra: ${añadidosAlCatalogo}`);
                addLog(`- Registros corregidos en el inventario: ${arregladosEnInventario}`);
                addLog(`Ya puedes abrir <b>maestra.html</b> y todo estará en orden.`);
                
                this.innerText = "Sincronización Exitosa";
                this.style.background = "#059669";
                
            } catch (err) {
                addLog(`<span style="color:#ef4444;">❌ Hubo un error de conexión: ${err}</span>`);
                this.innerText = "Reintentar";
                this.disabled = false;
            }
        });
