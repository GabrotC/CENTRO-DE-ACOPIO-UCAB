<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario General - SOS UCAB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; padding: 20px; color: #1e293b; transition: all 0.3s; }
        .card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 900px; margin: auto; transition: all 0.3s; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; margin-top: 20px; }
        th { color: #64748b; font-size: 0.75rem; text-transform: uppercase; padding: 10px; text-align: left; transition: all 0.3s; }
        td { background: #f1f5f9; padding: 14px; border-radius: 8px; font-weight: 500; transition: all 0.3s; }
        
        .btn-volver { background: #1e293b; color: white; padding: 10px 15px; border-radius: 8px; text-decoration: none; font-size: 0.9rem; display: inline-block; }
        .btn-excel { background: #16a34a; color: white; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; }
        .btn-theme { background: none; border: none; font-size: 1.5rem; cursor: pointer; }
        
        .filtro-cat { padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 0.9rem; background: white; }
        
        /* MODO OSCURO */
        body.dark-mode { background-color: #0f172a; color: #f8fafc; }
        body.dark-mode .card { background-color: #1e293b; color: #f8fafc; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        body.dark-mode td { background-color: #334155; color: #f8fafc; }
        body.dark-mode th { color: #94a3b8; }
        body.dark-mode .btn-volver { background-color: #4f46e5; }
        body.dark-mode .filtro-cat { background-color: #0f172a; color: #f8fafc; border-color: #475569; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-flex">
            <h2>📊 Reporte General de Existencias (Bruto)</h2>
            <div>
                <button id="themeToggle" class="btn-theme" title="Cambiar tema">🌙</button>
                <button id="btnExcel" class="btn-excel" onclick="descargarExcel()" style="display:none;">⬇️ Descargar Excel</button>
                <a href="index.html" class="btn-volver">Volver</a>
            </div>
        </div>
        
        <div style="margin: 15px 0; display: flex; gap: 10px; flex-wrap: wrap;">
            <select id="filtroCategoria" class="filtro-cat">
                <option value="Todas">Todas las categorías</option>
            </select>
        </div>
        
        <table>
            <thead><tr><th>Fecha Ingreso</th><th>Producto</th><th>Categoría</th><th>Cantidad</th><th>Presentación</th><th>Estado</th></tr></thead>
            <tbody id="tablaGeneral"></tbody>
        </table>
    </div>

    <script>
        // --- MODO OSCURO ---
        const themeToggle = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            themeToggle.innerText = '☀️';
        }
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                themeToggle.innerText = '☀️';
            } else {
                localStorage.setItem('theme', 'light');
                themeToggle.innerText = '🌙';
            }
        });

        if (sessionStorage.getItem('userRole') === 'admin') {
            document.getElementById('btnExcel').style.display = 'inline-block';
        }

        // ---- SUPABASE ----
        const SUPABASE_URL = "https://sjvpcgjazubguzoxzwxl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_dR9ot8lbyJHZTxupgdeJRg_WmqYWFk8";

        const resumen = {};
        const filtroCat = document.getElementById('filtroCategoria');

        // --- RENDERIZAR TABLA ---
        function renderizar() {
            const tbody = document.getElementById('tablaGeneral');
            const catSel = filtroCat.value;
            tbody.innerHTML = '';

            for (const [key, data] of Object.entries(resumen)) {
                if (catSel !== 'Todas' && data.categoria !== catSel) continue;

                let estado = data.cantidad > 10 ? "✅ Hay suficiente" : (data.cantidad > 0 ? "⚠️ Poco stock" : "🔴 Sin existencias");
                const fechaMostrar = data.ultimaFecha || data.primeraFecha || '-';

                tbody.innerHTML += `<tr>
                    <td>${fechaMostrar}</td>
                    <td>${data.producto}</td>
                    <td>${data.categoria || '-'}</td>
                    <td>${data.cantidad}</td>
                    <td>${data.obs || '-'}</td>
                    <td>${estado}</td>
                </tr>`;
            }
        }

        // --- CARGAR DATOS DESDE SUPABASE ---
        function cargarInventario() {
            document.getElementById('tablaGeneral').innerHTML = '<tr><td colspan="6" style="text-align:center; color:#64748b;">⏳ Cargando datos...</td></tr>';

            fetch(`${SUPABASE_URL}/rest/v1/inventario?select=*&order=created_at.asc`, {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`
                }
            })
            .then(res => { if (!res.ok) throw new Error(res.status); return res.json(); })
            .then(rows => {
                // Limpiar resumen y reconstruir
                Object.keys(resumen).forEach(k => delete resumen[k]);

                rows.forEach(item => {
                    const key = item.producto + '|||' + (item.obs || '');
                    if (!resumen[key]) {
                        resumen[key] = {
                            producto: item.producto,
                            categoria: item.categoria || '',
                            cantidad: 0,
                            obs: item.obs || '',
                            primeraFecha: item.fecha || '',
                            ultimaFecha: item.fecha || ''
                        };
                    }
                    resumen[key].cantidad += parseInt(item.cantidad) || 0;
                    if (item.fecha) {
                        if (!resumen[key].primeraFecha || item.fecha < resumen[key].primeraFecha)
                            resumen[key].primeraFecha = item.fecha;
                        if (item.fecha > resumen[key].ultimaFecha)
                            resumen[key].ultimaFecha = item.fecha;
                    }
                });

                // Poblar filtro de categorías
                const categorias = new Set(Object.values(resumen).map(d => d.categoria).filter(Boolean));
                filtroCat.innerHTML = '<option value="Todas">Todas las categorías</option>';
                Array.from(categorias).sort().forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c; opt.innerText = c;
                    filtroCat.appendChild(opt);
                });

                renderizar();
            })
            .catch(err => {
                document.getElementById('tablaGeneral').innerHTML = `<tr><td colspan="6" style="color:#e11d48; text-align:center;">❌ Error cargando datos: ${err}</td></tr>`;
            });
        }

        filtroCat.addEventListener('change', renderizar);
        cargarInventario();

        // --- EXPORTAR CSV ---
        function descargarExcel() {
            let csv = "Fecha,Producto,Categoría,Cantidad,Presentación\n";
            for (const [key, data] of Object.entries(resumen)) {
                csv += `${data.ultimaFecha || ''},${data.producto},${data.categoria},${data.cantidad},${data.obs}\n`;
            }
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Inventario_Entradas_UCAB.csv';
            a.click();
        }
        // ============================================================
        // SUPABASE REALTIME — admin ve cambios en vivo
        // ============================================================
        const { createClient } = window.supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_KEY);

        const badge = document.createElement('span');
        badge.id = 'liveBadge';
        badge.style.cssText = 'background:#16a34a;color:white;font-size:0.7rem;padding:3px 10px;border-radius:99px;margin-left:10px;animation:pulse 2s infinite;';
        badge.innerText = '🟢 En vivo';
        document.querySelector('h2')?.appendChild(badge);

        db.channel('inventario-admin')
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'inventario' }, () => {
              badge.innerText = '🟡 Actualizando...';
              badge.style.background = '#f59e0b';
              cargarInventario().then(() => {
                  badge.innerText = '🟢 En vivo';
                  badge.style.background = '#16a34a';
              });
          })
          .subscribe();
    </script>
</body>
</html>
