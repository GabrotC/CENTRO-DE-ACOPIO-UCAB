<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Entradas - SOS UCAB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f8fafc;
            --text: #1e293b;
            --card-bg: #ffffff;
            --navbar-bg: #1e293b;
            --table-row: #f1f5f9;
            --border: #e2e8f0;
            --success: #16a34a;
            --danger: #e11d48;
            --warning: #f59e0b;
        }
        body.dark-mode {
            --bg: #0f172a;
            --text: #f8fafc;
            --card-bg: #1e293b;
            --navbar-bg: #020617;
            --table-row: #334155;
            --border: #475569;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); transition: all 0.3s; padding: 2rem; }
        
        .card { background: var(--card-bg); padding: 2rem; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); max-width: 1200px; margin: 0 auto; border: 1px solid var(--border); }
        .header-flex { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem; border-bottom: 2px solid var(--border); padding-bottom: 1rem; }
        .header-flex h2 { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 0.75rem; }
        
        .actions { display: flex; gap: 0.75rem; align-items: center; }
        .btn { padding: 0.6rem 1rem; border-radius: 8px; font-weight: 600; font-size: 0.9rem; text-decoration: none; cursor: pointer; border: none; font-family: inherit; transition: all 0.3s; }
        .btn-volver { background: var(--navbar-bg); color: white; }
        .btn-volver:hover { opacity: 0.9; }
        .btn-excel { background: var(--success); color: white; display: none; }
        .btn-excel:hover { background: #15803d; }
        .btn-theme { background: transparent; font-size: 1.25rem; padding: 0.4rem; }
        
        .filters { margin-bottom: 1.5rem; display: flex; gap: 1rem; align-items: center; }
        .filtro-cat { padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; background: var(--bg); color: var(--text); font-family: inherit; min-width: 250px; }
        .filtro-cat:focus { outline: none; border-color: var(--primary); }
        
        .table-container { overflow-x: auto; max-height: 650px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: var(--card-bg); color: #64748b; font-size: 0.75rem; text-transform: uppercase; padding: 1rem; text-align: left; border-bottom: 2px solid var(--border); position: sticky; top: 0; }
        body.dark-mode th { color: #94a3b8; }
        td { padding: 1rem; font-size: 0.95rem; border-bottom: 1px solid var(--border); }
        tr:hover td { background: var(--table-row); }
        
        .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 99px; font-size: 0.75rem; font-weight: 700; }
        .badge-ok { background: rgba(22, 163, 74, 0.1); color: var(--success); }
        .badge-low { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        
        #liveBadge { background: var(--success); color: white; font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 99px; font-weight: 600; transition: background 0.3s; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-flex">
            <h2>
                📊 Reporte de Entradas (Bruto)
                <span id="liveBadge">🟢 En vivo</span>
            </h2>
            <div class="actions">
                <button id="themeToggle" class="btn btn-theme" title="Cambiar tema">🌙</button>
                <button id="btnExcel" class="btn btn-excel" onclick="descargarExcel()">⬇️ Exportar CSV</button>
                <a href="index.html" class="btn btn-volver">Volver al Inicio</a>
            </div>
        </div>
        
        <div class="filters">
            <select id="filtroCategoria" class="filtro-cat">
                <option value="Todas">Todas las categorías</option>
            </select>
        </div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Último Ingreso</th>
                        <th>Producto</th>
                        <th>Categoría</th>
                        <th>Cantidad Total</th>
                        <th>Presentación / Obs.</th>
                        <th>Estado Stock</th>
                    </tr>
                </thead>
                <tbody id="tablaGeneral">
                    <tr><td colspan="6" style="text-align:center; color:#64748b; padding:2rem;">⏳ Cargando inventario...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // INIT
        initTheme('themeToggle');
        
        if (sessionStorage.getItem('userRole') === 'admin') {
            document.getElementById('btnExcel').style.display = 'inline-block';
        }

        const resumen = {};
        const filtroCat = document.getElementById('filtroCategoria');
        const badge = document.getElementById('liveBadge');

        // RENDER TABLE
        function renderizar() {
            const tbody = document.getElementById('tablaGeneral');
            const catSel = filtroCat.value;
            tbody.innerHTML = '';

            const sortedKeys = Object.keys(resumen).sort();

            sortedKeys.forEach(key => {
                const data = resumen[key];
                if (catSel !== 'Todas' && data.categoria !== catSel) return;

                let estadoHtml = data.cantidad > 10 
                    ? `<span class="badge badge-ok">✅ Suficiente</span>` 
                    : `<span class="badge badge-low">⚠️ Poco stock</span>`;
                
                const fechaMostrar = data.ultimaFecha ? data.ultimaFecha.split(' ')[0] : '-';

                tbody.innerHTML += `<tr>
                    <td>${fechaMostrar}</td>
                    <td><strong>${data.producto}</strong></td>
                    <td><span style="font-size:0.8rem;color:#64748b;">${data.categoria || '-'}</span></td>
                    <td style="font-weight:700;font-size:1.1rem;">${data.cantidad}</td>
                    <td>${data.obs || '-'}</td>
                    <td>${estadoHtml}</td>
                </tr>`;
            });

            if (tbody.children.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#64748b;padding:2rem;">No hay entradas en esta categoría.</td></tr>';
            }
        }

        // LOAD FROM SUPABASE
        function cargarInventario() {
            return supabaseGet('inventario', 'select=*&order=created_at.asc')
                .then(rows => {
                    Object.keys(resumen).forEach(k => delete resumen[k]);

                    rows.forEach(item => {
                        const key = item.producto + '|||' + (item.obs || '');
                        if (!resumen[key]) {
                            resumen[key] = {
                                producto: item.producto,
                                categoria: item.categoria || 'Otros',
                                cantidad: 0,
                                obs: item.obs || '',
                                ultimaFecha: ''
                            };
                        }
                        resumen[key].cantidad += parseInt(item.cantidad) || 0;
                        if (item.fecha && item.fecha > resumen[key].ultimaFecha) {
                            resumen[key].ultimaFecha = item.fecha;
                        }
                    });

                    // Update filters
                    const prevCat = filtroCat.value;
                    const categorias = new Set(Object.values(resumen).map(d => d.categoria));
                    filtroCat.innerHTML = '<option value="Todas">Todas las categorías</option>';
                    Array.from(categorias).sort().forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c; opt.innerText = c;
                        filtroCat.appendChild(opt);
                    });
                    filtroCat.value = prevCat;

                    renderizar();
                })
                .catch(err => {
                    document.getElementById('tablaGeneral').innerHTML = `<tr><td colspan="6" style="color:var(--danger); text-align:center; padding:2rem;">❌ Error cargando datos de Supabase.</td></tr>`;
                    console.error(err);
                });
        }

        filtroCat.addEventListener('change', renderizar);
        cargarInventario();

        // CSV EXPORT
        window.descargarExcel = function() {
            let csv = "Última Fecha,Producto,Categoría,Cantidad,Presentación\n";
            for (const [key, data] of Object.entries(resumen)) {
                const f = data.ultimaFecha ? data.ultimaFecha.split(' ')[0] : '';
                csv += `"${f}","${data.producto}","${data.categoria}",${data.cantidad},"${data.obs}"\n`;
            }
            const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], { type: 'text/csv;charset=utf-8;' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Entradas_UCAB_${fechaHoy()}.csv`;
            a.click();
        };

        // REALTIME
        const db = crearClienteSupabase();
        if (db) {
            db.channel('inventario-general')
              .on('postgres_changes', { event: '*', schema: 'public', table: 'inventario' }, () => {
                  badge.innerText = '🟡 Actualizando...';
                  badge.style.background = 'var(--warning)';
                  cargarInventario().then(() => {
                      badge.innerText = '🟢 En vivo';
                      badge.style.background = 'var(--success)';
                  });
              })
              .subscribe();
        }
    </script>
</body>
</html>
