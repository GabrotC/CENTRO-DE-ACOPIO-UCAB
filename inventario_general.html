<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario General - SOS UCAB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; padding: 20px; color: #1e293b; transition: all 0.3s; }
        .card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 1000px; margin: auto; transition: all 0.3s; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; margin-top: 20px; }
        th { color: #64748b; font-size: 0.75rem; text-transform: uppercase; padding: 10px; text-align: left; transition: all 0.3s; }
        td { background: #f1f5f9; padding: 14px; border-radius: 8px; font-weight: 500; transition: all 0.3s; }
        
        .btn-volver { background: #1e293b; color: white; padding: 10px 15px; border-radius: 8px; text-decoration: none; font-size: 0.9rem; display: inline-block; }
        .btn-theme { background: none; border: none; font-size: 1.5rem; cursor: pointer; }
        .btn-accion { border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: transform 0.2s; }
        .btn-accion:hover { transform: scale(1.05); }
        .btn-editar { background: #f59e0b; color: white; margin-right: 5px; }
        .btn-eliminar { background: #e11d48; color: white; }
        
        .filtro-cat { padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 0.9rem; background: white; }
        
        /* MODO OSCURO */
        body.dark-mode { background-color: #0f172a; color: #f8fafc; }
        body.dark-mode .card { background-color: #1e293b; color: #f8fafc; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        body.dark-mode td { background-color: #334155; color: #f8fafc; }
        body.dark-mode th { color: #94a3b8; }
        body.dark-mode .btn-volver { background-color: #4f46e5; }
        body.dark-mode .filtro-cat { background-color: #0f172a; color: #f8fafc; border-color: #475569; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-flex">
            <h2>📊 Reporte General de Existencias (Detallado)</h2>
            <div>
                <button id="themeToggle" class="btn-theme" title="Cambiar tema">🌙</button>
                <a href="index.html" class="btn-volver">Volver</a>
            </div>
        </div>
        
        <div style="margin: 15px 0; display: flex; gap: 10px; flex-wrap: wrap;">
            <select id="filtroCategoria" class="filtro-cat">
                <option value="Todas">Todas las categorías</option>
            </select>
        </div>
        
        <table>
            <thead><tr><th>Fecha Ingreso</th><th>Producto</th><th>Categoría</th><th>Cantidad</th><th>Presentación</th><th>Acciones</th></tr></thead>
            <tbody id="tablaGeneral"></tbody>
        </table>
    </div>

    <script>
        // --- MODO OSCURO ---
        const themeToggle = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'dark') { document.body.classList.add('dark-mode'); themeToggle.innerText = '☀️'; }
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeToggle.innerText = isDark ? '☀️' : '🌙';
        });

        // ---- SUPABASE ----
        const SUPABASE_URL = "https://sjvpcgjazubguzoxzwxl.supabase.co";
        const SUPABASE_KEY = "sb_publishable_dR9ot8lbyJHZTxupgdeJRg_WmqYWFk8";
        const headersSupa = { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" };

        let inventarioDatos = [];
        const filtroCat = document.getElementById('filtroCategoria');

        // --- RENDERIZAR TABLA ---
        function renderizar() {
            const tbody = document.getElementById('tablaGeneral');
            const catSel = filtroCat.value;
            tbody.innerHTML = '';

            inventarioDatos.forEach(item => {
                if (catSel !== 'Todas' && item.categoria !== catSel) return;

                tbody.innerHTML += `<tr>
                    <td>${item.fecha || '-'}</td>
                    <td>${item.producto}</td>
                    <td>${item.categoria || '-'}</td>
                    <td style="font-weight:bold;">${item.cantidad}</td>
                    <td>${item.obs || '-'}</td>
                    <td>
                        <button class="btn-accion btn-editar" onclick="editarItem('${item.id}', '${item.producto.replace(/'/g, "\\'")}', ${item.cantidad})">✏️</button>
                        <button class="btn-accion btn-eliminar" onclick="eliminarItem('${item.id}', '${item.producto.replace(/'/g, "\\'")}')">🗑️</button>
                    </td>
                </tr>`;
            });
        }

        // --- CARGAR DATOS ---
        function cargarInventario() {
            document.getElementById('tablaGeneral').innerHTML = '<tr><td colspan="6" style="text-align:center; color:#64748b;">⏳ Cargando datos...</td></tr>';

            fetch(`${SUPABASE_URL}/rest/v1/inventario?select=*&order=created_at.desc`, { headers: headersSupa })
            .then(res => { if (!res.ok) throw new Error(res.status); return res.json(); })
            .then(rows => {
                inventarioDatos = rows;
                
                // Poblar filtro
                const categorias = new Set(rows.map(d => d.categoria).filter(Boolean));
                const catActual = filtroCat.value;
                filtroCat.innerHTML = '<option value="Todas">Todas las categorías</option>';
                Array.from(categorias).sort().forEach(c => {
                    filtroCat.innerHTML += `<option value="${c}">${c}</option>`;
                });
                filtroCat.value = Array.from(categorias).includes(catActual) ? catActual : 'Todas';

                renderizar();
            })
            .catch(err => {
                document.getElementById('tablaGeneral').innerHTML = `<tr><td colspan="6" style="color:#e11d48; text-align:center;">❌ Error cargando datos: ${err}</td></tr>`;
            });
        }

        // --- ACCIONES CON CONFIRMACIÓN ---
        function editarItem(id, producto, cantActual) {
            const nuevaCant = prompt(`✏️ Modificando: ${producto}\n\nIngresa la nueva cantidad:`, cantActual);
            
            if (nuevaCant !== null && nuevaCant.trim() !== "" && !isNaN(nuevaCant)) {
                if (confirm(`⚠️ ¿Estás seguro de que deseas guardar el cambio?\n\nProducto: ${producto}\nNueva cantidad: ${nuevaCant}`)) {
                    
                    fetch(`${SUPABASE_URL}/rest/v1/inventario?id=eq.${id}`, {
                        method: 'PATCH',
                        headers: { ...headersSupa, "Prefer": "return=minimal" },
                        body: JSON.stringify({ cantidad: parseInt(nuevaCant) })
                    }).then(() => cargarInventario()).catch(err => alert("Error al actualizar: " + err));
                }
            } else if (nuevaCant !== null) {
                alert("❌ Cantidad inválida. Operación cancelada.");
            }
        }

        function eliminarItem(id, producto) {
            if (confirm(`🚨 ADVERTENCIA 🚨\n\n¿Estás completamente seguro de que deseas eliminar el registro de "${producto}"?\n\nEsta acción NO se puede deshacer.`)) {
                fetch(`${SUPABASE_URL}/rest/v1/inventario?id=eq.${id}`, {
                    method: 'DELETE',
                    headers: headersSupa
                }).then(() => cargarInventario()).catch(err => alert("Error al eliminar: " + err));
            }
        }

        filtroCat.addEventListener('change', renderizar);
        cargarInventario();

        // --- SUPABASE REALTIME ---
        const { createClient } = window.supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_KEY);

        const badge = document.createElement('span');
        badge.style.cssText = 'background:#16a34a;color:white;font-size:0.7rem;padding:3px 10px;border-radius:99px;margin-left:10px;animation:pulse 2s infinite;';
        badge.innerText = '🟢 En vivo';
        document.querySelector('h2').appendChild(badge);

        db.channel('inventario-admin')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'inventario' }, () => {
              badge.innerText = '🟡 Actualizando...'; badge.style.background = '#f59e0b';
              cargarInventario();
              setTimeout(() => { badge.innerText = '🟢 En vivo'; badge.style.background = '#16a34a'; }, 1000);
          }).subscribe();
    </script>
</body>
</html>
